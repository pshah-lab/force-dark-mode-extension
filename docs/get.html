<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get ThemeSwitcher — Redirecting to the Chrome Web Store</title>
    <meta name="description" content="Redirecting to the Force Dark Mode - ThemeSwitcher listing on the Chrome Web Store." />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=https://chromewebstore.google.com/detail/force-dark-mode/kmhhphbakbhohiohagkhhgdgfbplkfke" />
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07090e;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .wrap {
        max-width: 380px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        display: block;
      }
      p {
        color: #94a3b8;
        margin: 0.75rem 0 1.5rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.6rem;
        border-radius: 9999px;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="assets/icon.svg" alt="" class="mark" width="64" height="64" />
      <h1 style="font-size: 1.25rem; margin: 0;">Taking you to the Chrome Web Store&hellip;</h1>
      <p>If nothing happens, click below.</p>
      <a href="https://chromewebstore.google.com/detail/force-dark-mode/kmhhphbakbhohiohagkhhgdgfbplkfke">Open ThemeSwitcher on the Chrome Web Store</a>
    </div>
    <script>
      location.replace("https://chromewebstore.google.com/detail/force-dark-mode/kmhhphbakbhohiohagkhhgdgfbplkfke");
    </script>
  </body>
</html>
