<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="popup">
      <div class="site" id="site">Loading...</div>
      <div class="recommendation" id="recommendation" hidden>
        Recommendation unavailable
      </div>

      <button id="toggle" class="toggle-btn">
        <span class="status-dot"></span>
        <span class="label">Loading…</span>
      </button>

      <div class="shortcut-hint" id="shortcut-hint" hidden></div>

      <div class="engine-group">
        <label class="engine-option">
          <input type="radio" name="engine" value="auto" />
          <span>Auto Engine</span>
        </label>

        <label class="engine-option">
          <input type="radio" name="engine" value="css" />
          <span>CSS Engine</span>
        </label>

        <label class="engine-option">
          <input type="radio" name="engine" value="invert" />
          <span>Invert Engine</span>
        </label>
      </div>

      <label class="theme-control">
        <span>Theme</span>
        <select id="theme-select"></select>
      </label>

      <label class="color-control">
        <span>CSS background</span>
        <input id="background-color" type="color" value="#0f1115" />
      </label>

      <div class="filter-group">
        <label class="filter-control">
          <span>Brightness</span>
          <input id="brightness" type="range" min="50" max="150" value="100" />
        </label>

        <label class="filter-control">
          <span>Contrast</span>
          <input id="contrast" type="range" min="50" max="150" value="100" />
        </label>

        <label class="filter-control">
          <span>Sepia</span>
          <input id="sepia" type="range" min="0" max="100" value="0" />
        </label>

        <button id="reset-filters" type="button" class="reset-filters-btn">
          Reset filters
        </button>
      </div>

      <div class="document-tools">
        <button id="open-pdf-viewer" type="button" hidden>
          Open PDF in dark viewer
        </button>
        <button id="open-document-viewer" type="button">Open file viewer</button>
      </div>

      <div class="report-section">
        <button id="report-site" type="button" class="report-btn" hidden>Report this site as broken</button>
        <div class="report-card" id="report-card" hidden>
          <p class="report-card-title" id="report-title"></p>
          <p class="report-card-text" id="report-body"></p>
          <p class="report-card-domain">Domain to send: <strong id="report-domain"></strong></p>
          <div class="report-card-actions">
            <button id="report-send" type="button"></button>
            <button id="report-cancel" type="button"></button>
          </div>
        </div>
        <p class="report-status" id="report-status" role="status" aria-live="polite" hidden></p>
      </div>

      <div class="feedback-prompt" id="feedback-prompt" hidden>
        <p class="feedback-prompt-title">Finding it useful?</p>
        <p class="feedback-prompt-text">A short review helps others find it. Have a suggestion? Tell us. Nothing is sent from your browser; these open web pages.</p>
        <div class="feedback-prompt-actions">
          <a id="feedback-rate" href="https://chromewebstore.google.com/detail/force-dark-mode/kmhhphbakbhohiohagkhhgdgfbplkfke/reviews" target="_blank" rel="noopener noreferrer">Leave a review ↗</a>
          <a id="feedback-report" href="https://darkmode.pshah.fun/support.html#feedback" target="_blank" rel="noopener noreferrer">Send feedback ↗</a>
        </div>
        <div class="feedback-prompt-actions secondary">
          <button id="feedback-later" type="button">Not now</button>
          <button id="feedback-never" type="button">Don't ask again</button>
        </div>
      </div>

      <div class="popup-footer">
        <a id="rate-link" href="https://chromewebstore.google.com/detail/force-dark-mode/kmhhphbakbhohiohagkhhgdgfbplkfke/reviews" target="_blank" rel="noopener noreferrer" class="feedback-link">
          Rate ★
        </a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="https://darkmode.pshah.fun/support.html#feedback" target="_blank" rel="noopener noreferrer" class="feedback-link">
          Feedback &amp; Suggestions ↗
        </a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a id="site-css-link" href="#" class="feedback-link" hidden>Site CSS…</a>
      </div>
    </div>

    <script src="feedbackPrompt.js"></script>
    <script src="reportCard.js"></script>
    <script src="../shared/themeCore.js"></script>
    <script src="../shared/builtinThemes.js"></script>
    <script src="../shared/sitePacks.js"></script>
    <script src="panelTabEvents.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
